name: Sync projects

# Pull every project's committed results into the site (scripts/sync_all.py),
# rebuild, run check_site.py, and open one pull request when anything changed.
# If a hand-written figure no longer matches the file it cites, the job fails and
# its summary says which page to update. Nothing is merged automatically.
#
# Runs daily, on the "Run workflow" button, and when a project repo sends a
# repository_dispatch of type "project-updated".
#
# One-time setting: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [project-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: shmorsi.github.io
      - uses: actions/checkout@v4
        with:
          repository: shmorsi/deep-portfolio-constructor
          path: deep-portfolio-constructor
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: shmorsi/tsfm-from-scratch
          path: tsfm-from-scratch
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: shmorsi/world-shock-lab
          path: world-shock-lab
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: shmorsi/aurvane
          path: aurvane
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # World Shock Lab's app is served from this repository; build it from that project's main.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: world-shock-lab/web/package-lock.json
      - name: Build the World Shock Lab app
        working-directory: world-shock-lab/web
        run: |
          npm ci
          npm run build

      - name: Sync, rebuild and check
        run: python3 shmorsi.github.io/scripts/sync_all.py --src .

      # check_site.py already passed above. A pull request opened with the
      # default token does not start other workflows, so that run is the check.
      - name: Open or update the sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: shmorsi.github.io
          branch: auto/sync-projects
          delete-branch: true
          commit-message: Sync results from the project repositories
          title: Sync results from the project repositories
          body: |
            Generated by `scripts/sync_all.py` from each project's `main`.
            `check_site.py` passed in the run that opened this pull request:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: sync
