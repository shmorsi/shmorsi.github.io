<!doctype html>
<!-- The LinkedIn cover (1584 x 396), drawn in the site's own look: the ringed giant, its rings made of points,
     and the growth of $1 from the Deep Portfolio Constructor (data/dpc_wealth.json) rising toward it.
     Open through the site's local server (python3 -m http.server 4173) at /scripts/linkedin_cover.html and
     screenshot the page at 1584 x 396, device scale 2. The text keeps clear of the bottom-left corner,
     where LinkedIn places the profile photo. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn cover</title>
<style>
  @font-face { font-family: "Inter Tight"; src: url("../assets/fonts/inter-tight-latin.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: #000; }
  .cover { position: relative; width: 1584px; height: 396px; font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif; color: #f4f5f7; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 1584px; height: 396px; }
  .copy { position: absolute; left: 520px; top: 62px; width: 700px; }
  .label { display: flex; align-items: center; gap: 14px; font-size: 13px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #8ec5ff; }
  .label::before { content: ""; width: 34px; height: 1px; background: #8ec5ff; }
  h1 { margin-top: 18px; font-size: 45px; line-height: 1.0; font-weight: 550; letter-spacing: 0.015em; text-transform: uppercase; white-space: nowrap; }
  h1 span { display: block; }
  h1 .dim { color: #8ec5ff; }
  .line { margin-top: 18px; font-size: 15.5px; line-height: 1.45; color: #b9bcc4; max-width: 500px; }
  .foot { position: absolute; left: 520px; bottom: 30px; display: flex; gap: 22px; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #8c8f97; }
  .foot b { color: #f4f5f7; font-weight: 600; }
  .foot i { width: 3px; height: 3px; background: #8ec5ff; display: inline-block; }
</style>
</head>
<body>
<div class="cover">
  <canvas id="sky" width="3168" height="792"></canvas>
  <div class="copy">
    <p class="label">AI for long-term investing</p>
    <h1><span>Built from first principles.</span><span class="dim">Measured honestly.</span></h1>
    <p class="line">Portfolios, pension plans and forecasting models in PyTorch, and AI agents that act inside signed limits. Every test fixed before it is run.</p>
  </div>
  <p class="foot"><b>shmorsi.github.io</b><i></i><span>Deep learning</span><i></i><span>Pension &amp; portfolio research</span><i></i><span>Agentic AI</span></p>
</div>
<script>
(async () => {
  const c = document.getElementById("sky"), g = c.getContext("2d");
  const W = 1584, H = 396;
  g.scale(2, 2);
  let seed = 20261110;
  const rnd = () => { seed = (seed * 48271) % 2147483647; return seed / 2147483647; };
  const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());

  /* space: black, a faint blue nebula behind the planet, stars */
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  const neb = (x, y, r, col) => { const q = g.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, col); q.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = q; g.fillRect(0, 0, W, H); };
  neb(1250, 150, 560, "rgba(40,70,160,0.34)"); neb(520, 420, 520, "rgba(30,50,120,0.20)"); neb(1500, 380, 300, "rgba(80,60,170,0.16)");
  for (let i = 0; i < 520; i += 1) {
    const x = rnd() * W, y = rnd() * H, s = rnd();
    g.fillStyle = `rgba(${200 + rnd() * 55 | 0},${215 + rnd() * 40 | 0},255,${0.18 + s * s * 0.75})`;
    const r = 0.35 + s * s * 1.1;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }

  /* the growth of $1 since 1960 (the project's own result), as a line of points rising toward the planet */
  try {
    const wealth = await (await fetch("../data/dpc_wealth.json")).json();
    const series = wealth.growth.deep, n = series.length, top = Math.log(series[n - 1]);
    for (let i = 0; i < n; i += 1) {
      const t = i / (n - 1), x = 40 + t * 1130, y = 382 - (Math.log(series[i]) / top) * 218 * (0.2 + 0.8 * t);
      for (let k = 0; k < 3; k += 1) {
        const a = (0.10 + 0.5 * t) * (k ? 0.5 : 1);
        g.fillStyle = `rgba(${150 + 60 * t | 0},${200 + 30 * t | 0},255,${a})`;
        g.beginPath(); g.arc(x + gauss() * (k ? 5 : 0.8), y + gauss() * (k ? 5 : 0.8), k ? 0.55 : 0.9, 0, 7); g.fill();
      }
    }
  } catch (e) { /* the cover still stands without the line */ }

  /* the ringed giant */
  const cx = 1352, cy = 186, R = 128, tilt = -0.36, squash = 0.30;
  const ring = (front) => {
    for (let i = 0; i < 9000; i += 1) {
      const band = rnd(), rr = band < 0.55 ? 1.45 + rnd() * 0.42 : band < 0.9 ? 2.02 + rnd() * 0.36 : 2.5 + rnd() * 0.12;
      const a = rnd() * Math.PI * 2, ex = Math.cos(a) * rr * R, ey = Math.sin(a) * rr * R * squash;
      if ((ey > 0) !== front) continue;
      const x = cx + ex * Math.cos(tilt) - ey * Math.sin(tilt), y = cy + ex * Math.sin(tilt) + ey * Math.cos(tilt);
      const warm = rnd() < 0.08, lit = 0.35 + 0.65 * (0.5 + 0.5 * Math.cos(a - 2.4));
      g.fillStyle = warm ? `rgba(255,190,120,${0.55 * lit})` : `rgba(${190 + rnd() * 50 | 0},${220 + rnd() * 30 | 0},255,${(0.25 + rnd() * 0.6) * lit})`;
      g.beginPath(); g.arc(x, y, 0.45 + rnd() * 0.75, 0, 7); g.fill();
    }
  };
  ring(false);
  g.save();
  g.beginPath(); g.arc(cx, cy, R, 0, 7); g.clip();
  g.fillStyle = "#1d2a78"; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  g.translate(cx, cy); g.rotate(-0.30);
  const bandAt = (v) => 0.5 + 0.5 * Math.sin(v * 0.105 + 1.3 + Math.sin(v * 0.033) * 2.0) + 0.10 * Math.sin(v * 0.47);
  for (let x = -R; x < R; x += 4) {                       /* cloud bands: each column reads the band a little higher or lower, so they drift */
    for (let b = -R; b < R; b += 1) {
      const k = Math.max(0, Math.min(1, bandAt(b + Math.sin(x * 0.021 + b * 0.017) * 5 + Math.sin(x * 0.006) * 7)));
      g.fillStyle = `rgb(${38 + 196 * k | 0},${56 + 186 * k | 0},${150 + 102 * k | 0})`;
      g.fillRect(x, b, 4.5, 1.5);
    }
  }
  g.setTransform(2, 0, 0, 2, 0, 0);
  const shade = g.createRadialGradient(cx - R * 0.55, cy - R * 0.5, R * 0.1, cx + R * 0.15, cy + R * 0.1, R * 1.25);
  shade.addColorStop(0, "rgba(255,255,255,0.20)"); shade.addColorStop(0.42, "rgba(0,0,0,0)"); shade.addColorStop(0.78, "rgba(0,0,10,0.62)"); shade.addColorStop(1, "rgba(0,0,6,0.97)");
  g.fillStyle = shade; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  g.restore();
  const rim = g.createRadialGradient(cx, cy, R * 0.99, cx, cy, R * 1.045);
  rim.addColorStop(0, "rgba(150,200,255,0.26)"); rim.addColorStop(1, "rgba(150,200,255,0)");
  g.fillStyle = rim; g.beginPath(); g.arc(cx, cy, R * 1.045, 0, 7); g.arc(cx, cy, R, 0, 7, true); g.fill();
  ring(true);

  /* a soft fade under the text, so it reads over the stars */
  const veil = g.createLinearGradient(380, 0, 1180, 0);
  veil.addColorStop(0, "rgba(0,0,0,0)"); veil.addColorStop(0.2, "rgba(0,0,0,0.5)"); veil.addColorStop(0.7, "rgba(0,0,0,0.34)"); veil.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = veil; g.fillRect(380, 30, 760, 340);
  await document.fonts.ready;
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
